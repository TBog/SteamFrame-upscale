name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  layer:
    name: Build & test OpenXR layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential libvulkan-dev libopenxr-dev glslang-tools mesa-vulkan-drivers
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  decky-plugin:
    name: Build Decky plugin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: decky-plugin
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: decky-plugin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  install-script-consistency:
    name: get.sh / docs/get.sh must match
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: diff get.sh docs/get.sh
