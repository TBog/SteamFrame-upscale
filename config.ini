; Passthrough denoise settings
[passthrough]
; weight of the current frame on static pixels (lower = smoother)
temporal_alpha = 0.15
; abs luma delta (0..1) above which temporal blending is bypassed
motion_threshold = 0.08
; max CAS sharpening intensity (0..1)
sharpness_weight = 0.8
; contrast below this is treated as noise and not sharpened
noise_floor = 0.02
